<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>SysaiQ — Admin</title>
<style>
  :root{
    --bg:#0b0f1a; --panel:#121828; --panel2:#0e1422; --line:rgba(236,234,246,.1);
    --ink:#eceaf6; --dim:rgba(236,234,246,.6); --mint:#7dffd9; --violet:#8b6bff;
    --danger:#ff6b7d; --ok:#7dffd9;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:14px}
  a{color:var(--mint)}
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit;width:100%;background:var(--panel2);border:1px solid var(--line);
    color:var(--ink);border-radius:8px;padding:9px 11px;font-size:13.5px}
  textarea{min-height:70px;resize:vertical;line-height:1.6}
  label{display:block;font-size:11px;letter-spacing:.04em;color:var(--dim);margin:10px 0 4px;text-transform:uppercase}
  .btn{background:linear-gradient(135deg,var(--mint),var(--violet));color:#06101f;border:none;
    border-radius:8px;padding:10px 18px;font-weight:600;font-size:13px}
  .btn.sm{padding:6px 12px;font-size:12px}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>*{flex:1;min-width:220px}
  .muted{color:var(--dim)}

  /* login */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  #login .card{width:340px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:30px}
  #login h1{font-size:20px;font-weight:300;margin-bottom:4px}
  #login .logo{font-weight:700;background:linear-gradient(135deg,var(--mint),var(--violet));
    -webkit-background-clip:text;background-clip:text;color:transparent}

  /* app shell */
  #app{display:none;min-height:100vh}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;
    border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:10}
  header .brand{font-weight:700;font-size:16px}
  header .brand span{background:linear-gradient(135deg,var(--mint),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
  nav.tabs{display:flex;gap:4px;padding:12px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap;
    background:var(--panel2);position:sticky;top:53px;z-index:9}
  nav.tabs button{background:transparent;border:1px solid transparent;color:var(--dim);
    border-radius:8px;padding:7px 14px;font-size:13px}
  nav.tabs button.on{background:var(--panel);border-color:var(--line);color:var(--ink)}
  main{padding:22px;max-width:1000px;margin:0 auto}
  h2.section{font-size:17px;font-weight:400;margin-bottom:4px}
  .hint{color:var(--dim);font-size:12.5px;margin-bottom:18px}
  .item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .item h3{font-size:14px;font-weight:500;margin-bottom:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .fa-field textarea,.fa-field input{direction:rtl}
  .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel);
    border:1px solid var(--mint);color:var(--ink);padding:12px 22px;border-radius:10px;opacity:0;
    transition:opacity .3s;z-index:100;pointer-events:none}
  .toast.show{opacity:1}
  .lead{border-left:2px solid var(--violet)}
  .badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--dim)}
  .chatlog .u{color:var(--mint)} .chatlog .a{color:var(--violet)}
  .chatlog div{padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.6}
  @media (max-width:640px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <div class="card">
    <h1><span class="logo">SysaiQ</span></h1>
    <p class="muted" style="margin-bottom:18px">Admin panel</p>
    <label>Username</label>
    <input id="lg-user" autocomplete="username">
    <label>Password</label>
    <input id="lg-pass" type="password" autocomplete="current-password">
    <button class="btn" style="width:100%;margin-top:18px" onclick="doLogin()">Sign in</button>
    <p id="lg-err" style="color:var(--danger);font-size:12.5px;margin-top:10px;min-height:16px"></p>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <header>
    <div class="brand"><span>SysaiQ</span> Admin</div>
    <div class="row" style="flex:0">
      <a href="/" target="_blank" class="btn ghost sm">View site ↗</a>
      <button class="btn ghost sm" onclick="doLogout()">Sign out</button>
    </div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
</div>

<div class="toast" id="toast"></div>

<script src="/admin/app.js"></script>
</body>
</html>
