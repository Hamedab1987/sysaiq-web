# SysaiQ — nginx reverse proxy.
# Static site served directly; API + admin proxied to the Node app.
# certbot will add the TLS/443 block and the http->https redirect.
server {
    listen 80;
    listen [::]:80;
    server_name sysaiq.com www.sysaiq.com;

    client_max_body_size 10m;
    root /var/www/sysaiq/site;

    # language redirect at root (JS file already handles it; keep index)
    index index.html;

    # API + admin -> Node backend
    location /api/    { proxy_pass http://127.0.0.1:3000; include /etc/nginx/proxy_params; }
    location /admin   { proxy_pass http://127.0.0.1:3000; include /etc/nginx/proxy_params; }
    location /admin/  { proxy_pass http://127.0.0.1:3000; include /etc/nginx/proxy_params; }
    location /uploads/{ proxy_pass http://127.0.0.1:3000; include /etc/nginx/proxy_params; }

    # project detail pages (server-rendered) -> Node backend
    location ~ ^/(en|fa)/work/. { proxy_pass http://127.0.0.1:3000; include /etc/nginx/proxy_params; }

    # static site (fa/en) with graceful fallback
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
