# SysaiQ — nginx reverse proxy (target config after the M1 cutover).
#
# The LIVE file /etc/nginx/sites-enabled/sysaiq is certbot-managed: it carries
# the same server_name/root and the "# managed by Certbot" listen/ssl lines plus
# the port-80 redirect block. When deploying, copy ONLY the `location` lines and
# the gzip block below into the 443 server{} block (see .claude/skills/sysaiq-deploy).
#
# Routing model:
#   - /fa/ and /en/ (the home page) are rendered by Node from the database;
#     if Node is down nginx falls back to the baked static copy so the site stays up.
#   - every other /fa/... and /en/... page is server-rendered by Node.
#   - /assets/, og.jpg, robots.txt, the root redirector stay static.
server {
    server_name sysaiq.com www.sysaiq.com;

    # canonical host: eNamad checks the referrer domain, SEO wants one origin
    if ($host = www.sysaiq.com) { return 301 https://sysaiq.com$request_uri; }

    client_max_body_size 10m;
    root /var/www/sysaiq/site;
    index index.html;

    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

    # ---- Node backend ----
    location /api/     { proxy_pass http://127.0.0.1:3000; include /etc/nginx/proxy_params; }
    location /admin    { proxy_pass http://127.0.0.1:3000; include /etc/nginx/proxy_params; }
    location /admin/   { proxy_pass http://127.0.0.1:3000; include /etc/nginx/proxy_params; }
    location /uploads/ { proxy_pass http://127.0.0.1:3000; include /etc/nginx/proxy_params; }
    location /p/       { proxy_pass http://127.0.0.1:3000; include /etc/nginx/proxy_params; }
    location = /sitemap.xml { proxy_pass http://127.0.0.1:3000; include /etc/nginx/proxy_params; }
    location = /healthz     { proxy_pass http://127.0.0.1:3000; include /etc/nginx/proxy_params; }

    # baked home pages are only reachable as the internal fallback below,
    # never as a duplicate public URL
    location = /fa/index.html { internal; }
    location = /en/index.html { internal; }

    # home page: rendered from the database, baked copy when Node is unavailable
    location = /fa/ {
        proxy_pass http://127.0.0.1:3000; include /etc/nginx/proxy_params;
        proxy_intercept_errors on; proxy_connect_timeout 2s;
        error_page 500 502 503 504 =200 /fa/index.html;
    }
    location = /en/ {
        proxy_pass http://127.0.0.1:3000; include /etc/nginx/proxy_params;
        proxy_intercept_errors on; proxy_connect_timeout 2s;
        error_page 500 502 503 504 =200 /en/index.html;
    }

    # every other localized page (work, services, pages, contact, news, pay…)
    location ~ ^/(en|fa)/.+ {
        proxy_pass http://127.0.0.1:3000; include /etc/nginx/proxy_params;
        proxy_intercept_errors on;
        error_page 502 503 504 /maintenance.html;
    }

    # static assets (fonts, three.js, images, site css/js) — long cache
    location /assets/ { expires 7d; add_header Cache-Control "public"; try_files $uri =404; }

    # root redirector, og.jpg, robots.txt, maintenance.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # (certbot adds: listen 443 ssl + ssl_certificate lines)
}

# (certbot adds the port-80 → https redirect server block)
