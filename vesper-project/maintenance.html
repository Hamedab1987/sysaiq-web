<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="120">
<title>SysaiQ — به‌روزرسانی</title>
<link rel="icon" type="image/png" href="/assets/favicon-64.png">
<style>
  @font-face{font-family:'Vazirmatn';src:url(/assets/vazirmatn-var.woff2) format('woff2-variations');font-weight:100 900;font-display:swap;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:#050507 radial-gradient(120% 80% at 50% -10%,rgba(139,107,255,.14),transparent 55%);
    color:#eceaf6;font-family:Vazirmatn,-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.9;}
  main{max-width:560px;width:100%;}
  .eyebrow{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:10px;letter-spacing:.22em;
    text-transform:uppercase;color:rgba(236,234,246,.32);direction:ltr;text-align:end;}
  .rule{height:1px;margin:22px 0 26px;background:linear-gradient(135deg,#7dffd9,#8b6bff);opacity:.8;}
  h1{font-size:clamp(26px,5vw,40px);font-weight:300;line-height:1.25;letter-spacing:0;}
  h1 em{font-style:normal;background:linear-gradient(135deg,#7dffd9,#8b6bff);-webkit-background-clip:text;background-clip:text;color:transparent;}
  p{margin-top:12px;font-size:15px;color:rgba(236,234,246,.6);}
  .en{margin-top:34px;padding-top:26px;border-top:1px solid rgba(236,234,246,.12);direction:ltr;text-align:left;
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Helvetica,Arial,sans-serif;}
  .en h2{font-size:clamp(20px,3.6vw,28px);font-weight:300;line-height:1.3;letter-spacing:-.02em;}
  .en p{font-size:14px;line-height:1.7;}
  a{color:#7dffd9;text-decoration:none;}
  a:hover{color:#fff;}
</style>
</head>
<body>
<main>
  <div class="eyebrow">[ SYSAIQ — MAINTENANCE ]</div>
  <div class="rule"></div>
  <h1>سایت به‌طور موقت <em>در دسترس نیست</em></h1>
  <p>در حال به‌روزرسانی هستیم و به‌زودی برمی‌گردیم. اگر عجله دارید، به <a href="mailto:hello@sysaiq.com" dir="ltr">hello@sysaiq.com</a> ایمیل بزنید.</p>
  <section class="en" lang="en">
    <h2>SysaiQ is briefly unavailable</h2>
    <p>We are updating the site and will be back shortly. In a hurry? Email <a href="mailto:hello@sysaiq.com">hello@sysaiq.com</a>.</p>
  </section>
</main>
</body>
</html>
